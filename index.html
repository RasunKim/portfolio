<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laseon Kim — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="prototypes/kweather/kweather.js"></script>
  <script type="module" src="prototypes/kanana/kanana.js"></script>
</head>
<body>
  <header class="site-header">
    <a href="#" class="brand">Laseon Kim</a>
    <nav class="primary-nav">
      <a href="#work">Work</a>
      <a href="#resume">Résumé</a>
    </nav>
    <div class="header-toggles">
      <button class="toggle" aria-label="Language">Ko</button>
      <button class="toggle" aria-label="Theme">Dark</button>
    </div>
  </header>

  <main class="work-grid" id="work">
    <div class="col">
    <!-- Col 1, top — Kanana (tall, uses featured screen) -->
    <a class="card card-tall" href="projects/kanana/" aria-label="AI Service Design — Kanana AI Search">
      <div class="card-media">
        <kanana-prototype screen="chatroom"></kanana-prototype>
      </div>
      <p class="card-caption">Mobil &amp; PC Design, Kakao AI Service Design</p>
    </a>

    <!-- Col 1, bottom — Emoticon Promo (short, video) -->
    <a class="card card-short card-emoticon" href="#" aria-label="Web Design — Kakao Emoticon Promotion">
      <div class="card-media">
        <video class="card-video" autoplay loop muted playsinline preload="metadata">
          <source src="assets/emoticon.mov" type="video/mp4" />
        </video>
      </div>
      <p class="card-caption">Web Design, Kakao emoticon Promotion</p>
    </a>
    </div>

    <div class="col">
    <!-- Col 2, top — Kanana web recording (short) -->
    <a class="card card-short" href="projects/playmcp/" aria-label="WEB Design — Play MCP">
      <div class="card-media">
        <video class="web-video" autoplay loop muted playsinline preload="metadata">
          <source src="assets/kanana-web.mov" type="video/mp4" />
        </video>
      </div>
      <p class="card-caption">WEB Design, Kakao AI Service Design</p>
    </a>

    <!-- Col 2, bottom — ETA (tall) -->
    <a class="card card-tall" href="#" aria-label="Mobile Design — ETA Location Service">
      <div class="card-media">
        <img class="card-svg-mobile" src="assets/eta-card.svg" alt="ETA mobile" />
      </div>
      <p class="card-caption">iOS Native Design, Side Project</p>
    </a>
    </div>

    <div class="col">
    <!-- Col 3, top — OpenChat -->
    <a class="card card-tall" href="projects/openchat/" aria-label="Kakao OpenChat">
      <div class="card-media">
        <img class="card-svg-mobile" src="assets/openchat-card.svg" alt="Kakao OpenChat" />
      </div>
      <p class="card-caption">Mobile Native Design(iOS &amp; Android), Kakao Service</p>
    </a>

    <!-- Col 3, bottom — EXP (short) -->
    <a class="card card-short card-exp" href="#resume" aria-label="Experience">
      <h2 class="exp-heading">EXP</h2>
      <div class="exp-years">
        <span style="--col:1">2018</span>
        <span style="--col:4">2021</span>
        <span style="--col:5">2022</span>
      </div>
      <div class="exp-bars">
        <span class="bar b1"></span>
        <span class="bar b2"></span>
        <span class="bar b3"></span>
        <span class="bar b4"></span>
        <span class="bar b5"></span>
        <span class="bar b6"></span>
        <span class="bar b7"></span>
        <span class="bar b8"></span>
        <span class="bar b9"></span>
      </div>
    </a>
    </div>
  </main>

  <footer class="site-footer">
    <p>© 2026 Laseon Kim</p>
    <a href="mailto:hello@laseon.kim" class="email-link">email</a>
  </footer>
</body>
</html>
