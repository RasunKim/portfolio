<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KWeather Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f5f5f5;
      font-family: "Inter", "Noto Sans KR", -apple-system, sans-serif;
    }
    .stage {
      background: #fff;
      border-radius: 24px;
      padding: 48px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.05);
    }
    .label {
      margin: 0 0 24px;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #8f8f8f;
      text-align: center;
    }
  </style>
  <script type="module" src="./kweather.js"></script>
</head>
<body>
  <div class="stage">
    <p class="label">&lt;kweather-prototype&gt;</p>
    <kweather-prototype></kweather-prototype>
  </div>
</body>
</html>
